services:
  postgres:
    image: postgres:16
    container_name: sprintdesk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprintdesk
    ports:
      - "5433:5432"
    volumes:
      - sprintdesk_data:/var/lib/postgresql/data

volumes:
  sprintdesk_data: